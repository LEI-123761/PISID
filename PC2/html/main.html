<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Tarefas</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

<div class="phone-container">

    <div class="top-bar">
        <span class="user-name">&lt;Nome&gt;</span>

        <button class="create-btn">
            Criar +
        </button>
    </div>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Descrição</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>

        <tbody>

        <tr>
            <td>1</td>
            <td>&lt;Descrição 1&gt;</td>
            <td>Terminado</td>
            <td></td>
        </tr>

        <tr>
            <td>2</td>
            <td>&lt;Descrição 2&gt;</td>
            <td>Correr</td>
            <td></td>
        </tr>

        <tr>
            <td>3</td>
            <td>&lt;Descrição 3&gt;</td>
            <td>Criado</td>
            <td class="actions">
                ✏️ ▶
            </td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
